<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="pvTitle pvDesc">
  <title id="pvTitle">Illustrative preview of the Claude AI Video Editing course PDF</title>
  <desc id="pvDesc">A stylised, non-final mock-up of the course PDF: a cover page with the course title, a table of contents panel and a video editing timeline with clips and captions. It is an illustration only and does not show final page counts.</desc>

  <defs>
    <linearGradient id="pageShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F7F2E9"/>
    </linearGradient>
    <linearGradient id="coralBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CC785C"/>
      <stop offset="1" stop-color="#B5654A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1F1B16" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="880" rx="28" fill="#F5F0E8"/>
  <circle cx="1035" cy="120" r="150" fill="#F4DDD1" opacity="0.75"/>
  <circle cx="130" cy="770" r="110" fill="#EFE8DC"/>

  <!-- Master page -->
  <g filter="url(#softShadow)">
    <rect x="86" y="84" width="470" height="620" rx="16" fill="url(#pageShade)" stroke="#E2D9C8"/>
    <rect x="86" y="84" width="470" height="10" rx="5" fill="url(#coralBar)"/>

    <text x="126" y="168" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#B5654A">DIGITAL PDF COURSE</text>

    <text x="126" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1F1B16">Claude AI</text>
    <text x="126" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1F1B16">Video Editing</text>
    <text x="126" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#CC785C">workflow guide</text>

    <rect x="126" y="392" width="120" height="4" rx="2" fill="#CC785C"/>

    <text x="126" y="440" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="18" fill="#857B6D">Prompt-driven editing, scripting,</text>
    <text x="126" y="468" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="18" fill="#857B6D">and repeatable content workflows.</text>

    <rect x="126" y="522" width="180" height="44" rx="22" fill="#1F1B16"/>
    <text x="216" y="550" text-anchor="middle" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5F0E8">Start here</text>

    <rect x="126" y="606" width="390" height="1" fill="#E2D9C8"/>
    <text x="126" y="644" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" fill="#857B6D">Reading workflow &#183; prompts &#183; checklists</text>
    <text x="126" y="670" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" fill="#857B6D">Desktop + mobile friendly PDF</text>
  </g>

  <!-- Contents panel -->
  <g filter="url(#softShadow)">
    <rect x="600" y="84" width="514" height="256" rx="18" fill="#FFFDF9" stroke="#E2D9C8"/>
    <text x="636" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1F1B16">What&#8217;s inside</text>

    <g font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="17" fill="#4A4238">
      <circle cx="646" cy="172" r="7" fill="#CC785C"/><text x="668" y="178">Editing basics with AI assistance</text>
      <circle cx="646" cy="212" r="7" fill="#CC785C"/><text x="668" y="218">Planning a repeatable workflow</text>
      <circle cx="646" cy="252" r="7" fill="#CC785C"/><text x="668" y="258">Prompt writing for real projects</text>
      <circle cx="646" cy="292" r="7" fill="#2E7D5B"/><text x="668" y="298">Review, polish and final delivery</text>
    </g>
  </g>

  <!-- Timeline panel -->
  <g filter="url(#softShadow)">
    <rect x="600" y="372" width="514" height="332" rx="18" fill="#FFFDF9" stroke="#E2D9C8"/>

    <text x="636" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1F1B16">Editing timeline</text>
    <circle cx="1064" cy="410" r="10" fill="#2E7D5B" opacity="0.2"/>
    <circle cx="1064" cy="410" r="5" fill="#2E7D5B"/>

    <!-- tracks -->
    <g>
      <rect x="636" y="446" width="442" height="26" rx="6" fill="#EFE8DC"/>
      <rect x="636" y="446" width="150" height="26" rx="6" fill="#F4DDD1"/>
      <rect x="792" y="446" width="120" height="26" rx="6" fill="#CC785C" opacity="0.85"/>
      <rect x="918" y="446" width="160" height="26" rx="6" fill="#EFE8DC"/>

      <rect x="636" y="486" width="442" height="26" rx="6" fill="#EFE8DC"/>
      <rect x="652" y="486" width="96" height="26" rx="6" fill="#CC785C" opacity="0.55"/>
      <rect x="756" y="486" width="180" height="26" rx="6" fill="#F4DDD1"/>
      <rect x="944" y="486" width="134" height="26" rx="6" fill="#CC785C" opacity="0.75"/>

      <rect x="636" y="526" width="442" height="26" rx="6" fill="#EFE8DC"/>
      <rect x="636" y="526" width="250" height="26" rx="6" fill="#2E7D5B" opacity="0.25"/>
      <rect x="900" y="526" width="178" height="26" rx="6" fill="#EFE8DC"/>
    </g>

    <!-- playhead -->
    <line x1="836" y1="436" x2="836" y2="566" stroke="#1F1B16" stroke-width="2.5"/>
    <circle cx="836" cy="436" r="7" fill="#1F1B16"/>

    <!-- caption chips -->
    <rect x="636" y="586" width="200" height="34" rx="17" fill="#1F1B16"/>
    <text x="736" y="608" text-anchor="middle" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" fill="#F5F0E8">Draft &#8594; Review</text>
    <rect x="848" y="586" width="230" height="34" rx="17" fill="#F4DDD1"/>
    <text x="963" y="608" text-anchor="middle" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" fill="#B5654A">Repeatable exports</text>

    <text x="636" y="668" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" fill="#857B6D">Illustrative layout only &#8212; not the actual course pages.</text>
  </g>

  <!-- lower note band -->
  <g>
    <rect x="86" y="736" width="1028" height="72" rx="18" fill="#1F1B16"/>
    <text x="126" y="780" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="17" fill="#EFE8DC">Secure checkout &#183; instant private download link &#183; delivered to your email</text>
  </g>
</svg>
